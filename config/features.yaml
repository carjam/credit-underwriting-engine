# Feature Configuration for Credit Underwriting Model
#
# This file defines which features are permitted in the model to prevent target leakage.
# Only features known at application/decision time should be included.

# Application-time features: information available to the lender at the time of decision
application_time_features:
  # Loan characteristics
  - loan_amnt
  - funded_amnt
  - funded_amnt_inv
  - term  # will be one-hot encoded
  - installment
  
  # Applicant employment and income
  - emp_length  # will be one-hot encoded
  - annual_inc
  - verification_status  # will be one-hot encoded
  
  # Credit bureau data (at application time)
  - fico_range_low
  - fico_range_high
  - earliest_cr_line  # converted to credit history length in months
  - inq_last_6mths
  - delinq_2yrs
  - mths_since_last_delinq
  - mths_since_last_record
  - open_acc
  - pub_rec
  - revol_bal
  - revol_util
  - total_acc
  
  # Loan purpose and geography
  - purpose  # will be one-hot encoded
  - home_ownership  # will be one-hot encoded
  - addr_state  # will be one-hot encoded (may need grouping for rare states)
  - dti
  
  # Additional bureau attributes (at origination)
  - collections_12_mths_ex_med
  - mths_since_last_major_derog
  - acc_now_delinq
  - tot_coll_amt
  - tot_cur_bal
  - open_acc_6m
  - open_act_il
  - open_il_12m
  - open_il_24m
  - mths_since_rcnt_il
  - total_bal_il
  - il_util
  - open_rv_12m
  - open_rv_24m
  - max_bal_bc
  - all_util
  - total_rev_hi_lim
  - inq_fi
  - total_cu_tl
  - inq_last_12m
  - acc_open_past_24mths
  - avg_cur_bal
  - bc_open_to_buy
  - bc_util
  - chargeoff_within_12_mths
  - delinq_amnt
  - mo_sin_old_il_acct
  - mo_sin_old_rev_tl_op
  - mo_sin_rcnt_rev_tl_op
  - mo_sin_rcnt_tl
  - mort_acc
  - mths_since_recent_bc
  - mths_since_recent_bc_dlq
  - mths_since_recent_inq
  - mths_since_recent_revol_delinq
  - num_accts_ever_120_pd
  - num_actv_bc_tl
  - num_actv_rev_tl
  - num_bc_sats
  - num_bc_tl
  - num_il_tl
  - num_op_rev_tl
  - num_rev_accts
  - num_rev_tl_bal_gt_0
  - num_sats
  - num_tl_120dpd_2m
  - num_tl_30dpd
  - num_tl_90g_dpd_24m
  - num_tl_op_past_12m
  - pct_tl_nvr_dlq
  - percent_bc_gt_75
  - pub_rec_bankruptcies
  - tax_liens
  - tot_hi_cred_lim
  - total_bal_ex_mort
  - total_bc_limit
  - total_il_high_credit_limit
  
  # Joint application fields (if applicable)
  - annual_inc_joint
  - dti_joint
  - verification_status_joint
  - revol_bal_joint
  - sec_app_fico_range_low
  - sec_app_fico_range_high
  - sec_app_earliest_cr_line
  - sec_app_inq_last_6mths
  - sec_app_mort_acc
  - sec_app_open_acc
  - sec_app_revol_util
  - sec_app_open_act_il
  - sec_app_num_rev_accts
  - sec_app_chargeoff_within_12_mths
  - sec_app_collections_12_mths_ex_med
  - sec_app_mths_since_last_major_derog

# Lender-assigned pricing features (decision: include separately)
# These are NOT post-outcome leakage, but they encode Lending Club's own risk model.
# Run experiments with and without these to show the impact.
pricing_features:
  - grade
  - sub_grade
  - int_rate

# POST-OUTCOME FEATURES - BLOCKLIST
# These features are ONLY known after the loan has been paid off or defaulted.
# Including any of these in training would be target leakage.
post_outcome_blocklist:
  # Payment history (only known after origination)
  - total_pymnt
  - total_pymnt_inv
  - total_rec_prncp
  - total_rec_int
  - total_rec_late_fee
  - recoveries
  - collection_recovery_fee
  - last_pymnt_d
  - last_pymnt_amnt
  - next_pymnt_d
  
  # Outstanding principal (changes over loan life)
  - out_prncp
  - out_prncp_inv
  
  # Bureau refresh data (pulled during loan servicing, not at application)
  - last_credit_pull_d
  - last_fico_range_high
  - last_fico_range_low
  
  # Hardship and modification data (only applies to loans in trouble)
  - hardship_flag
  - hardship_type
  - hardship_reason
  - hardship_status
  - deferral_term
  - hardship_amount
  - hardship_start_date
  - hardship_end_date
  - payment_plan_start_date
  - hardship_length
  - hardship_dpd
  - hardship_loan_status
  - orig_projected_additional_accrued_interest
  - hardship_payoff_balance_amount
  - hardship_last_payment_amount
  
  # Settlement data (only applies to charged-off loans)
  - debt_settlement_flag
  - debt_settlement_flag_date
  - settlement_status
  - settlement_date
  - settlement_amount
  - settlement_percentage
  - settlement_term

# Non-predictive fields (identifiers, URLs, descriptions)
non_predictive:
  - id
  - member_id
  - url
  - desc
  - title
  - emp_title
  - zip_code
  - issue_d
  - loan_status  # this is the TARGET
  - pymnt_plan
  - initial_list_status
  - policy_code
  - application_type
  - disbursement_method
  - year
